<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0D">
  <script>/* diseño guardado: se pone antes de pintar (sin parpadeo) */try{var fpT=localStorage.getItem('FP_TEMA');if(fpT)document.documentElement.setAttribute('data-tema',fpT);}catch(e){}</script>
  <meta name="fp-modo" content="web">
  <meta name="fp-api" content="https://script.google.com/macros/s/AKfycbw5qT9I0mlAhF9Rq3Z-NVLWNXjdbBEUluoF8Myeue34csoiyxEC5F6aVOoENU14xF39/exec">
  <title>Fineplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://i.imgur.com">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@700&family=VT323&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   FINEPLAY · ESTILOS — mismos colores del logo
   negro #0B0B0D · burdeos #6E1230/#7A1232 · lila #C07CFB/#A956F7 · crema #F7EEF2
   Liviano para gama baja (Pixel 5) y media (Redmi Note): sin desenfoques animados.
   ===================================================================== */
:root{
  --negro:#0B0B0D; --negro2:#121014; --panel:#18121A; --panel2:#21161F; --linea:rgba(247,238,242,.09);
  --vino:#6E1230; --vino2:#7A1232; --vino-osc:#3E0E1E; --vino-noche:#22090F;
  --lila:#C07CFB; --lila2:#A956F7; --lila-claro:#DDB8FF; --crema:#F7EEF2;
  --gris:#B79AA8; --gris2:#8A7280; --verde:#2BD58A; --rojo:#FF5C7A; --wsp:#25D366;
  --grad-logo:linear-gradient(135deg,#0B0B0D 0%,#3E0E1E 55%,#7A1232 100%);
  --grad-lila:linear-gradient(135deg,#A956F7,#D59BFF);
  /* Diseños: cada tema solo cambia estas variables (cambio instantáneo, sin recargar) */
  --lila-rgb:192,124,251; --lila2-rgb:169,86,247; --crema-rgb:247,238,242; --negro-rgb:11,11,13;
  --sobre-lila:#1B0628; --texto-suave:#E8D4FF; --sw-off:#3A2C35;
  --grad-card:linear-gradient(135deg,#2A0B17,#4A0F24 60%,#6E1230);
  --grad-mini:linear-gradient(90deg,#3E0E1E,#5A1129);
  --top-bg:rgba(11,11,13,.94); --nav-bg:#0B0B0D;
  --r:16px; --nav:64px; --mini:66px;
  --fuente:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--negro);color:var(--crema);font-family:var(--fuente);font-size:16px;line-height:1.35}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block}
a{color:var(--lila-claro)}
[hidden]{display:none!important}
::selection{background:rgba(var(--lila-rgb),.35)}

/* ---------- Pantalla de carga (navegador) ---------- */
#fpSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--grad-splash,var(--grad-logo));transition:opacity .35s}
#fpSplash .ico{width:108px;height:108px;filter:drop-shadow(0 12px 30px rgba(var(--lila-rgb),.35))}
#fpSplash .ico svg{width:100%;height:100%}
#fpSplash .fp-logotipo-txt{font-size:38px}
#fpSplash .ondas{display:flex;gap:5px;height:26px;align-items:flex-end}
#fpSplash .ondas i{width:5px;border-radius:3px;background:var(--lila);animation:fpOnda 1s ease-in-out infinite}
#fpSplash .ondas i:nth-child(2){animation-delay:.15s}#fpSplash .ondas i:nth-child(3){animation-delay:.3s}#fpSplash .ondas i:nth-child(4){animation-delay:.45s}
@keyframes fpOnda{0%,100%{height:6px}50%{height:26px}}

/* ---------- Logotipo ---------- */
.fp-logotipo{display:inline-flex;align-items:center;gap:9px}
.fp-logotipo-ico{width:34px;height:34px;flex:none}
.fp-logotipo-ico svg{width:100%;height:100%}
.fp-logotipo-txt{font-size:24px;letter-spacing:-.5px;line-height:1}
.fp-logotipo-txt .fine{font-weight:300;color:#F7EEF2}
.fp-logotipo-txt .play{font-weight:800;color:#C07CFB}

/* ---------- Encabezado ---------- */
.fp-top{position:sticky;top:0;z-index:50;background:var(--top-bg);border-bottom:1px solid var(--linea)}
.fp-top-fila{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.fp-top .fp-logotipo{cursor:pointer;flex:none}
.fp-buscar{flex:1;display:flex;align-items:center;gap:8px;min-width:0;height:40px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--linea);color:var(--gris)}
.fp-buscar input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--crema);font-size:15px}
.fp-buscar input::placeholder{color:var(--gris2)}
.fp-buscar svg{width:18px;height:18px;flex:none}
.fp-avatar{width:40px;height:40px;flex:none;border-radius:50%;overflow:hidden;background:var(--vino);display:grid;place-items:center;font-weight:700;font-size:17px;border:2px solid rgba(var(--lila-rgb),.55);position:relative}
.fp-avatar img{width:100%;height:100%;object-fit:cover}
.fp-avatar .punto{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#FFB020;border:2px solid var(--negro)}
.fp-avatar.sin{background:var(--panel);color:var(--gris)}
.fp-avatar.sin svg{width:22px;height:22px}
.fp-offline{display:none;align-items:center;justify-content:center;gap:6px;padding:4px 10px;font-size:12px;font-weight:600;color:#FFD9A0;background:#2A1A08;border-bottom:1px solid rgba(255,176,32,.25)}
body.sin-red .fp-offline{display:flex}

/* ---------- Contenido ---------- */
#vista{max-width:760px;margin:0 auto;padding:14px 14px calc(var(--nav) + var(--mini) + 40px)}
body.sin-mini #vista{padding-bottom:calc(var(--nav) + 30px)}
.titulo{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:6px 0 14px}
.subtitulo{font-size:18px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.subtitulo a,.subtitulo button{font-size:13px;font-weight:600;color:var(--lila)}
.mini{font-size:13px;color:var(--gris)}
.centro{text-align:center}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-grad{background:var(--grad-card);border:1px solid rgba(var(--lila-rgb),.22)}
.vacio{text-align:center;color:var(--gris);padding:38px 18px}
.vacio .ic{font-size:44px;margin-bottom:10px}
.vacio b{display:block;color:var(--crema);font-size:18px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--linea);color:var(--crema);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--crema);color:var(--negro);border-color:var(--crema)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.estado{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px}
.estado.ok{background:rgba(43,213,138,.15);color:var(--verde)}
.estado.alerta{background:rgba(255,176,32,.15);color:#FFB020}
.estado.mal{background:rgba(255,92,122,.15);color:var(--rojo)}
.estado.lila{background:rgba(var(--lila-rgb),.16);color:var(--lila-claro)}

/* ---------- Botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:16px;margin-top:10px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55}
.btn-lila{background:var(--grad-lila);color:var(--sobre-lila);box-shadow:0 8px 22px rgba(var(--lila2-rgb),.32)}
.btn-crema{background:var(--crema);color:var(--negro)}
.btn-vino{background:var(--vino);color:var(--crema)}
.btn-borde{border:1.5px solid rgba(var(--crema-rgb),.28);color:var(--crema)}
.btn-wsp{background:var(--wsp);color:#062B14}
.btn-peligro{background:var(--rojo);color:#2A0710}
.btn-chico{min-height:38px;font-size:14px;width:auto;padding:6px 16px;margin-top:0}
.btn-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--crema);flex:none}
.btn-ico svg{width:24px;height:24px}
.btn-ico.on{color:var(--lila)}
.btn-play{width:56px;height:56px;border-radius:50%;background:var(--lila);color:var(--sobre-lila);display:grid;place-items:center;box-shadow:0 8px 24px rgba(var(--lila-rgb),.4);flex:none}
.btn-play svg{width:28px;height:28px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:999px;background:#fff;color:#1f1f1f;font-weight:600;font-size:16px}
.btn-google svg{width:22px;height:22px}
.fila-btns{display:flex;gap:10px}
.fila-btns .btn{margin-top:0}
.cargando{display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:currentColor;animation:fpGira .8s linear infinite;vertical-align:middle}
@keyframes fpGira{to{transform:rotate(360deg)}}

/* ---------- Formularios ---------- */
.campo{display:block;margin:12px 0 0}
.campo>span{display:block;font-size:13px;font-weight:600;color:var(--gris);margin:0 0 6px 4px}
.campo input,.campo textarea,.campo select{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--linea);background:var(--negro2);color:var(--crema);outline:0;font-size:16px}
.campo textarea{min-height:90px;resize:vertical;line-height:1.4}
.campo input[type=range]{min-height:0;padding:0;border:0;background:transparent}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--lila)}
.wsp-input{display:flex;align-items:center;border-radius:14px;border:1.5px solid var(--linea);background:var(--negro2);overflow:hidden}
.wsp-input:focus-within{border-color:var(--lila)}
.wsp-input em{font-style:normal;padding:0 4px 0 16px;color:var(--gris);font-weight:600}
.wsp-input input{border:0!important;background:none!important}
.tabs{display:flex;background:var(--negro2);border-radius:999px;padding:4px;margin:4px 0 6px}
.tabs button{flex:1;min-height:40px;border-radius:999px;font-weight:700;color:var(--gris);font-size:15px}
.tabs button.on{background:var(--panel2);color:var(--crema);box-shadow:inset 0 0 0 1px rgba(var(--lila-rgb),.35)}
.tabs-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:2px 14px}
.tabs-scroll::-webkit-scrollbar{display:none}
.separador{display:flex;align-items:center;gap:10px;color:var(--gris2);font-size:13px;margin:16px 0 4px}
.separador:before,.separador:after{content:"";flex:1;height:1px;background:var(--linea)}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--linea)}
.interruptor:last-child{border-bottom:0}
.interruptor b{display:block;font-weight:600}
.interruptor small{color:var(--gris);font-size:13px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--sw-off);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--lila2)}
.sw input:checked+span:after{transform:translateX(20px)}
.foto-elegir{display:flex;align-items:center;gap:14px;margin-top:12px}
.foto-elegir .prev{width:64px;height:64px;border-radius:50%;background:var(--panel2);overflow:hidden;display:grid;place-items:center;color:var(--gris);font-size:26px;flex:none;border:2px dashed rgba(var(--lila-rgb),.4)}
.foto-elegir .prev img{width:100%;height:100%;object-fit:cover}

/* ---------- Carátulas ---------- */
.svg-caja svg{width:100%;height:100%;display:block}
.car{position:relative;overflow:hidden;background:var(--panel2);border-radius:10px;flex:none}
.car img{width:100%;height:100%;object-fit:cover}
.car-gen{width:100%;height:100%;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ---------- Fila de canción ---------- */
.fp-fila{display:flex;align-items:center;gap:12px;height:64px;padding:0 2px;border-radius:12px;cursor:pointer}
.fp-fila:active{background:rgba(var(--crema-rgb),.05)}
.fp-fila .car{width:48px;height:48px;border-radius:8px}
.fp-fila .txt{flex:1;min-width:0}
.fp-fila .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-fila .s{font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fp-fila .d{font-size:12.5px;color:var(--gris2);flex:none;font-variant-numeric:tabular-nums}
.fp-fila .mas{width:36px;height:44px;display:grid;place-items:center;color:var(--gris);flex:none}
.fp-fila .mas svg{width:20px;height:20px}
.fp-fila.sonando .t{color:var(--lila)}
.fp-fila.no-disp{opacity:.4}
.fp-fila .num{width:26px;text-align:center;color:var(--gris2);font-size:13px;flex:none}
.fp-fila .eq{display:none;width:16px;height:14px;gap:2px;align-items:flex-end;flex:none}
.fp-fila.sonando .eq{display:flex}
.eq i{display:block;width:3px;background:var(--lila);border-radius:2px;animation:fpOnda2 .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.pausado .eq i{animation-play-state:paused}
@keyframes fpOnda2{0%,100%{height:3px}50%{height:14px}}
.fp-virtual{position:relative}
.fp-virtual>.fp-fila{position:absolute;left:0;right:0}
.fila-edicion{display:flex;gap:2px;flex:none}
.fila-edicion button{width:34px;height:40px;display:grid;place-items:center;color:var(--gris);border-radius:10px}
.fila-edicion button:active{background:rgba(var(--crema-rgb),.08)}
.fila-edicion svg{width:20px;height:20px}

/* ---------- Grillas (álbumes, listas, artistas) ---------- */
.fp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.fp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fp-tarjeta{cursor:pointer;min-width:0}
.fp-tarjeta .car{width:100%;aspect-ratio:1/1;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.fp-tarjeta .t{font-weight:700;font-size:15px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-tarjeta .s{font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-tarjeta.redonda .car{border-radius:50%}
.fp-tarjeta.redonda{text-align:center}
.fp-carril{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 6px}
.fp-carril::-webkit-scrollbar{display:none}
.fp-carril .fp-tarjeta{width:140px;flex:none}
.fp-nueva .car{display:grid;place-items:center;background:transparent;border:2px dashed rgba(var(--lila-rgb),.45);box-shadow:none}
.fp-nueva .car span{font-size:44px;color:var(--lila);font-weight:300}
.fp-accesos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fp-acceso{display:flex;align-items:center;gap:10px;height:58px;border-radius:12px;background:var(--panel);overflow:hidden;cursor:pointer;font-weight:700;font-size:14.5px;padding-right:8px}
.fp-acceso .car{width:58px;height:58px;border-radius:0}
.fp-acceso span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- Encabezado de lista / álbum ---------- */
.fp-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 6px}
.fp-hero .car{width:min(62vw,240px);height:min(62vw,240px);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(var(--lila-rgb),.15)}
.fp-hero .car.redonda{border-radius:50%}
.fp-hero .editar-car{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgba(var(--negro-rgb),.78);display:grid;place-items:center;color:var(--crema)}
.fp-hero .editar-car svg{width:20px;height:20px}
.fp-hero h2{font-size:25px;font-weight:800;margin:16px 0 4px;letter-spacing:-.4px;line-height:1.15}
.fp-hero p{margin:0;color:var(--gris);font-size:14px}
.fp-acciones{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
.fp-acciones .sep{flex:1}
.volver{display:inline-flex;align-items:center;gap:4px;color:var(--gris);font-weight:600;font-size:14px;margin:0 0 6px -4px;padding:6px 4px}
.volver svg{width:20px;height:20px}

/* ---------- Mini reproductor ---------- */
.fp-mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + 6px + env(safe-area-inset-bottom));z-index:60;height:var(--mini);max-width:744px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:14px;background:var(--grad-mini);box-shadow:0 10px 28px rgba(0,0,0,.5);cursor:pointer;overflow:hidden}
.fp-mini .car{width:48px;height:48px;border-radius:8px}
.fp-mini .txt{flex:1;min-width:0}
.fp-mini .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-mini .s{font-size:12.5px;color:var(--lila-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-mini .barra{position:absolute;left:10px;right:10px;bottom:3px;height:2.5px;border-radius:2px;background:rgba(var(--crema-rgb),.18)}
.fp-mini .barra i{display:block;height:100%;width:0;border-radius:2px;background:var(--crema)}
body.sin-mini .fp-mini{display:none}

/* ---------- Navegación inferior ---------- */
.fp-nav{position:fixed;left:0;right:0;bottom:0;z-index:61;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--nav-bg);border-top:1px solid var(--linea)}
.fp-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gris2);font-size:11.5px;font-weight:600}
.fp-nav button svg{width:25px;height:25px}
.fp-nav button.on{color:var(--crema)}
.fp-nav button.on svg{color:var(--lila)}

/* ---------- Reproductor completo ---------- */
.fp-player{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:var(--negro);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain}
.fp-player.abierto{transform:none}
.fp-player-fondo{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fp-player-fondo img{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(38px) saturate(1.3);opacity:.45}
.fp-player-fondo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--negro-rgb),.35),rgba(var(--negro-rgb),.82) 55%,var(--negro))}
.fp-player-in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:0 22px 26px}
.fp-player-cab{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px}
.fp-player-cab .de{text-align:center;font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:1.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-player-cab .de b{display:block;color:var(--crema);font-size:13.5px;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-player-art{width:min(82vw,360px);aspect-ratio:1/1;margin:14px auto 22px;border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.6),0 0 0 1px rgba(var(--lila-rgb),.14)}
.fp-player-info{display:flex;align-items:center;gap:10px}
.fp-player-info .txt{flex:1;min-width:0}
.fp-player-info .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.fp-player-info .s{font-size:15px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fp-progreso{margin:18px 0 4px}
.fp-rango{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:none}
.fp-rango::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--crema) var(--p,0%),rgba(var(--crema-rgb),.2) var(--p,0%))}
.fp-rango::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--crema);margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.fp-rango::-moz-range-track{height:4px;border-radius:4px;background:rgba(var(--crema-rgb),.2)}
.fp-rango::-moz-range-progress{height:4px;border-radius:4px;background:var(--crema)}
.fp-rango::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--crema)}
.fp-tiempos{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums;margin-top:-2px}
.fp-controles{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.fp-controles .btn-ico svg{width:30px;height:30px}
.fp-controles .btn-play{width:72px;height:72px}
.fp-controles .btn-play svg{width:34px;height:34px}
.fp-controles .peq svg{width:24px;height:24px}
.btn-ico .rep1{position:absolute;font-size:9px;font-weight:800;margin:14px 0 0 14px}
.fp-player-pie{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.fp-player-pie .btn-ico{width:46px;height:46px}
.fp-tempo-badge{font-size:11px;font-weight:800;color:var(--lila);margin-left:-6px}
#fpLedSlotPlayer{margin:0 -22px;overflow:hidden}
#fpLedSlotPlayer .dv-led-full{width:100%;margin-left:0;margin-right:0}

/* ---------- Hojas (bottom sheets), diálogos y toast ---------- */
.fp-hoja-fondo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fpAparece .18s ease}
.fp-hoja{width:100%;max-width:620px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:fpSube .24s cubic-bezier(.2,.8,.2,1)}
.fp-hoja:before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:rgba(var(--crema-rgb),.25);margin:0 auto 12px}
.fp-hoja h3{margin:4px 0 12px;font-size:19px}
.fp-hoja-cab{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--linea)}
.fp-hoja-cab .car{width:52px;height:52px;border-radius:8px}
.fp-hoja-cab .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-hoja-cab .s{font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-op{display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:0 6px;border-radius:12px;text-align:left;font-size:16px;font-weight:500}
.fp-op:active{background:rgba(var(--crema-rgb),.06)}
.fp-op svg{width:24px;height:24px;color:var(--gris);flex:none}
.fp-op .car{width:48px;height:48px;border-radius:8px}
.fp-op span b{color:var(--crema)}
.fp-op.peligro{color:var(--rojo)}.fp-op.peligro svg{color:var(--rojo)}
.fp-hoja-fondo.sale{opacity:0;transition:opacity .16s}
@keyframes fpAparece{from{opacity:0}}
@keyframes fpSube{from{transform:translateY(40px);opacity:.4}}
.dlg-fondo{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:22px;animation:fpAparece .15s}
.dlg-fondo.sale{opacity:0;transition:opacity .16s}
.dlg{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--linea);border-radius:22px;padding:22px 20px 18px;text-align:center}
.dlg-icono{font-size:40px;margin-bottom:6px}
.dlg h3{margin:4px 0 8px;font-size:19px}
.dlg p{margin:0 0 6px;color:var(--gris);font-size:15px}
.dlg .dlg-input{width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--negro2);color:var(--crema);font-size:16px;outline:0;resize:none}
.dlg .dlg-input:focus{border-color:var(--lila)}
.dlg-botones{display:flex;gap:10px;margin-top:14px}
.dlg-botones .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--mini) + 22px);z-index:500;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:#F7EEF2;color:#1A0A12;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:.22s}
body.con-hoja .toast{bottom:auto;top:18px}
.toast.ver{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.error{background:#3A0F1A;color:#FFD3DC;border:1px solid rgba(255,92,122,.4)}
.toast button{color:var(--vino);font-weight:800;margin-left:6px}
.codigo-grande{font-size:40px;font-weight:800;letter-spacing:10px;text-align:center;padding:14px 10px;margin:12px 0;border-radius:16px;background:var(--negro2);border:1.5px dashed rgba(var(--lila-rgb),.5);color:var(--lila-claro);font-variant-numeric:tabular-nums}
.aviso{padding:12px 14px;border-radius:14px;font-size:14px;margin:10px 0;line-height:1.4}
.aviso.info{background:rgba(var(--lila-rgb),.1);border:1px solid rgba(var(--lila-rgb),.25);color:var(--texto-suave)}
.aviso.ok{background:rgba(43,213,138,.1);border:1px solid rgba(43,213,138,.3);color:#BFF5DC}
.aviso.alerta{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.3);color:#FFE2A8}

/* ---------- Ecualizador ---------- */
.ecu{display:flex;justify-content:space-between;gap:6px;height:210px;margin:16px 0 4px}
.ecu-banda{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ecu-banda .val{font-size:11px;color:var(--lila-claro);font-variant-numeric:tabular-nums;height:14px}
.ecu-banda .riel{position:relative;flex:1;width:100%;display:flex;justify-content:center}
.ecu-banda input{-webkit-appearance:none;appearance:none;position:absolute;top:50%;left:50%;width:160px;height:28px;transform:translate(-50%,-50%) rotate(-90deg);background:transparent}
.ecu-banda input::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:rgba(var(--crema-rgb),.18)}
.ecu-banda input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--lila);margin-top:-8.5px;box-shadow:0 2px 10px rgba(var(--lila-rgb),.5)}
.ecu-banda .hz{font-size:11px;color:var(--gris)}
.ecu.apagado{opacity:.4;pointer-events:none}

/* ---------- Cuenta ---------- */
.perfil{display:flex;align-items:center;gap:16px}
.perfil .fp-avatar{width:72px;height:72px;font-size:28px}
.perfil b{font-size:19px;display:block}
.lista-ops{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:4px 12px;margin-bottom:12px}
.lista-ops .fp-op{padding:0}
.lista-ops .fp-op+.fp-op{border-top:1px solid var(--linea);border-radius:0}
.lista-ops .fp-op em{margin-left:auto;font-style:normal;color:var(--gris);font-size:13px}

/* ---------- Panel de administrador ---------- */
.adm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.adm-stat{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:10px;text-align:center}
.adm-stat b{display:block;font-size:22px;color:var(--lila-claro)}
.adm-stat span{font-size:11.5px;color:var(--gris)}
.adm-item{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:auto 150px}
.adm-item .cab{display:flex;align-items:center;gap:10px}
.adm-item .cab .txt{flex:1;min-width:0}
.adm-item .cab b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-item .cod{font-size:24px;font-weight:800;letter-spacing:4px;color:var(--lila-claro);font-variant-numeric:tabular-nums}
.adm-item .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.adm-item .btns .btn{flex:1;min-width:120px}
.led-ayuda{font-size:12.5px;color:var(--gris);line-height:1.5}
.led-ayuda code{background:var(--negro2);padding:1px 5px;border-radius:5px;color:var(--lila-claro)}

/* ---------- Escritorio ---------- */
@media (min-width:900px){
  .fp-player-in{padding-top:10px}
}

  /* ═══ LA LED NUNCA SE VE VACÍA (misma técnica que la LED principal de indexGIFT) ═══
     · En modo video ya no se ven las rayas del letrero detrás: se ve la última
       imagen mostrada o, si no hay, la marca FINEPLAY (nunca un hueco).
     · El video nace invisible y aparece apenas tiene imagen (sin cuadro gris). */
  #indicadores.modo-video{ background-image: none; }
  #videoLED{ opacity: 0; }
  #videoLED.dv-listo{ opacity: 1; }
  .dv-led-espera{
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: .3em;
    background: radial-gradient(ellipse at 50% 50%, rgba(192,124,251,.45), rgba(26,8,41,.96) 72%);
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 72px; letter-spacing: -1px; color: #fff;
    text-shadow: 0 0 18px rgba(192,124,251,.6);
    animation: dvLedEspera 1.6s ease-in-out infinite;
  }
  .dv-led-espera b{ color: #D9B3FF; font-weight: 800; }
  #indicadores.dv-con-fondo .dv-led-espera{ display: none; }
  @keyframes dvLedEspera{ 0%,100%{ opacity: 1; } 50%{ opacity: .65; } }

  /* ═══ ALERTA (tapa la LED: "TE INVITARON A CONVERSAR", "CHARLA EN CURSO"…) ═══
     La publicidad sigue andando por debajo; al quitar la alerta vuelve sola. */
  #ledAlertaVivo{
    position: absolute; inset: 0; z-index: 40; display: none; cursor: pointer;
    flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px),
      radial-gradient(ellipse at 50% 50%, rgba(192,124,251,.70), rgba(26,8,41,.97) 74%);
    border: 3px solid #C07CFB; box-shadow: inset 0 0 40px rgba(192,124,251,.5);
  }
  #ledAlertaVivo.on{ display: flex; animation: dvAlertaBorde 1.2s ease-in-out infinite; }
  #ledAlertaVivo em{ font-style: normal; }
  #ledAlertaVivo b{
    display: flex; align-items: center; gap: .35em;
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: 3px; color: #fff;
    text-shadow: 0 0 12px #C07CFB, 0 0 30px rgba(110,18,48,.9);
  }
  #ledAlertaVivo b i{ width: .6em; height: .6em; border-radius: 50%; background: #22D39A; box-shadow: 0 0 14px #22D39A; animation: dvAlertaPunto 1s steps(2, start) infinite; }
  #ledAlertaVivo span{ font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 28px; color: #F7EEF2; letter-spacing: 1px; text-shadow: 0 2px 0 #0B0B0D; }
  @keyframes dvAlertaBorde{ 0%,100%{ border-color: #C07CFB; } 50%{ border-color: #D9B3FF; } }
  @keyframes dvAlertaPunto{ to{ visibility: hidden; } }

  /* "Pincha aquí" independiente: no se reinicia con los cambios de la LED */
  #ledPinchaAquiWrap{
    position: absolute; left: 0; bottom: 10px; width: 100%;
    overflow: hidden; white-space: nowrap; z-index: 20; cursor: pointer;
    background: rgba(192,124,251,.20); display: none;
  }
  #ledPinchaAquiText{
    display: inline-block;
    font-family: 'Orbitron', sans-serif; font-size: 46px; font-weight: 700;
    color: #D9B3FF;
    text-shadow: -3px -3px 0 #0B0B0D, 3px -3px 0 #0B0B0D, -3px 3px 0 #0B0B0D, 3px 3px 0 #0B0B0D, 0 0 12px rgba(0,0,0,.9);
    animation: dvLedPincha 8s linear infinite; will-change: transform; user-select: none;
  }
  @keyframes dvLedPincha{ 0%{ transform: translateX(100vw); } 100%{ transform: translateX(-100%); } }

  #ledBrandLogo{
    position: absolute; top: 12px; left: 12px; z-index: 30;
    width: 120px; max-width: 34vw; height: auto; display: none; opacity: .8;
    -webkit-user-drag: none; user-select: none;
  }
  #ledBrandLogo:hover{ opacity: 1; }

  /* Celular Y app Android: dentro del WebView el viewport es ANCHO (~980px),
        por eso además de max-width se usa la condición de pantalla táctil. */
  /* Medidas = las de la LED principal de indexGIFT en celular (que se dibuja a
     980 de ancho): texto 270, imagen/video 400, letra 60, "Pincha" 46, logo 96.
     Van en vw (% del ancho) para que la LED ocupe exactamente la misma
     proporción de la pantalla que en G&M, en cualquier teléfono. */
  @media (max-width: 768px), (hover: none) and (pointer: coarse){
    #indicadores{ height: 27.6vw; }
    #indicadores.modo-video{ height: 40.8vw; }
    #ledContent{ font-size: 6.1vw; }
    #ledPinchaAquiText{ font-size: 4.7vw; }
    #ledPinchaAquiWrap{ bottom: 1vw; }
    #ledBrandLogo{ width: 9.8vw; top: 1vw; left: 1vw; }
    #videoLED, #imgLED{ object-fit: fill; }   /* nunca recortado */
    .dv-led-espera{ font-size: 9vw; }
    #ledAlertaVivo b{ font-size: 6.4vw; }
    #ledAlertaVivo span{ font-size: 3.6vw; }
  }

<div class="dv-led-full" id="ledTopWrap">
  <div id="indicadores"><span id="ledContent">FINEPLAY</span></div>
  <div id="ledPinchaAquiWrap" role="link" aria-label="Más información"><span id="ledPinchaAquiText">Pincha aquí para más información</span></div>
  <img id="ledBrandLogo" alt="Logo">
  <div id="ledAlertaVivo" role="button" aria-label="Ver aviso"><b><i></i><em id="ledAlertaTit">TE INVITARON</em></b><span id="ledAlertaSub">TOCA AQUÍ PARA VERLO</span></div>
</div>

<script id="dvLedJS">
(function () {
  "use strict";

  // Otra p\u00e1gina puede definir window.DV_LED_CFG ANTES de
  // incluir este archivo: { textoDef, espera, ckFondo, fn }. Sin eso, todo queda igual.
  var CFG       = window.DV_LED_CFG || {};
  var DUR_DEF   = 5000;                 // contenido sin par\u00e9ntesis de tiempo
  var CK        = "FP_LED_V1_";         // cach\u00e9 por p\u00e1gina
  var CK_FONDO  = CFG.ckFondo || "FP_LED_FONDO_V1";    // \u00faltima imagen vista (respaldo, nunca negro)
  var POSTER    = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  var TEXTO_DEF = CFG.textoDef || "FINEPLAY \u00b7 TU M\u00daSICA, REINVENTADA";
  // Lo que se ve detr\u00e1s mientras un video o una imagen carga (nunca rayas ni hueco)
  var ESPERA = CFG.espera || '<span class="dv-led-espera">Fine<b>play</b></span>';

  var gen = 0;            // generaci\u00f3n del bucle: un aviso de un bucle viejo se ignora
  var firmaLista = "";    // huella de la lista que suena (si es igual, no se reinicia)
  var timer = null;
  var pagina = "";
  var ultimaCarga = 0;
  var nItems = 0;

  function $(id) { return document.getElementById(id); }
  function leer(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function normUrl(u) {
    u = String(u || "").trim();
    if (!u) return "";
    if (/^www\./i.test(u)) return "https://" + u;
    if (!/^https?:\/\//i.test(u) && /^[a-z0-9.-]+\.[a-z]{2,}([\/:?#].*)?$/i.test(u)) return "https://" + u;
    return u;
  }
  function driveDirecto(u) {
    var m = String(u || "").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/i);
    return m ? "https://lh3.googleusercontent.com/d/" + m[1] : u;
  }

  // "3S" \u2192 3000 \u00b7 "4M" \u2192 240000 \u00b7 "3H" \u2192 10800000 \u00b7 "TIEMPO ORIGINAL" \u2192 original
  // Devuelve null si el texto NO es un tiempo (entonces es un link).
  function parseDuracion(txt) {
    var s = String(txt || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (!s) return null;
    if (/^(tiempo\s*)?(original|real)$/.test(s)) return { original: true, ms: 0 };
    var m = s.match(/^(\d+(?:[.,]\d+)?)\s*(s|seg|segs|segundo|segundos|m|min|mins|minuto|minutos|h|hr|hrs|hora|horas)$/);
    if (!m) return null;
    var n = parseFloat(m[1].replace(",", "."));
    if (!isFinite(n) || n <= 0) return null;
    var u = m[2], ms;
    if (/^(h|hr|hrs|hora|horas)$/.test(u)) ms = n * 3600000;
    else if (/^(m|min|mins|minuto|minutos)$/.test(u)) ms = n * 60000;
    else ms = n * 1000;
    return { original: false, ms: Math.max(500, Math.round(ms)) };
  }

  // "url(tiempo)(link)" \u2192 { url, link, durMs, durOriginal }  (tambi\u00e9n "url(link)" y "url")
  function parseToken(token) {
    var t = String(token || "").trim(), link = "", dur = null, grupos = [], m;
    while ((m = t.match(/\(([^()]*)\)\s*$/)) !== null && grupos.length < 3) {
      grupos.unshift(String(m[1] || "").trim());
      t = t.slice(0, m.index).trim();
    }
    grupos.forEach(function (g) {
      var d = parseDuracion(g);
      if (d && !dur) dur = d;
      else if (g && !link) link = g;
    });
    return {
      url: t,
      link: normUrl(link),
      durMs: (dur && !dur.original) ? dur.ms : 0,
      durOriginal: !!(dur && dur.original)
    };
  }

  function tipoDe(url) {
    var u = String(url).split("?")[0].toLowerCase();
    if (/\.(mp4|webm|mov|m4v)$/.test(u)) return "video";
    if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(u)) return "imagen";
    if (/^https:\/\/lh3\.googleusercontent\.com\/d\//i.test(url)) return "imagen";
    return null;
  }

  // "INICIO(logoUrl)(link), resto" \u2192 logo fijo + resto de la celda
  function extraerLogo(raw) {
    var s = String(raw || "").trim();
    var m = s.match(/^\s*([A-Za-z0-9 _-]{1,30})\(([^)]+)\)\s*(\(([^)]+)\))?\s*(?:,|\n|$)/);
    if (!m) return { logoUrl: "", logoLink: "", resto: s };
    var posible = String(m[2] || "").trim();
    if (!/^(https?:\/\/|www\.|[a-z0-9-]+(\.[a-z0-9-]+)+\/)/i.test(posible)) return { logoUrl: "", logoLink: "", resto: s };
    return { logoUrl: normUrl(posible), logoLink: normUrl(String(m[4] || "").trim()), resto: s.slice(m[0].length).trim() };
  }

  function firmaDe(items) {
    return items.map(function (i) { return [i.tipo, i.url, i.link, i.durMs, i.durOriginal ? 1 : 0].join("|"); }).join("\u00a7");
  }

  function abrirLink(link) {
    if (!link) return;
    try {
      var a = document.createElement("a");
      a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { try { window.open(link, "_blank", "noopener"); } catch (e2) {} }
  }

  function pincha(link) {
    var w = $("ledPinchaAquiWrap");
    if (!w) return;
    w.style.display = link ? "block" : "none";
    w.onclick = link ? function () { abrirLink(link); } : null;
  }

  function logo(url, link) {
    var el = $("ledBrandLogo");
    if (!el) return;
    if (!url) { el.style.display = "none"; el.removeAttribute("src"); el.onclick = null; return; }
    el.src = driveDirecto(url);
    el.style.display = "block";
    el.style.cursor = link ? "pointer" : "default";
    el.onclick = link ? function (e) { e.preventDefault(); e.stopPropagation(); abrirLink(link); } : null;
  }

  // Fondo de respaldo = \u00faltima imagen vista (as\u00ed la LED nunca queda en negro)
  function ponerFondo(url) {
    var c = $("indicadores");
    if (!c) return;
    if (url) guardar(CK_FONDO, url); else url = leer(CK_FONDO);
    if (url) c.style.backgroundImage = 'url("' + String(url).replace(/"/g, "%22") + '")';
    c.classList.toggle("dv-con-fondo", !!url);
  }

  // Apaga el bucle actual SIN tocar el DOM del video (solo lo marca y pausa)
  function detener() {
    if (timer) { clearTimeout(timer); timer = null; }
    var v = $("videoLED");
    if (v) { v._muerto = true; v.onended = null; if (v._vigia) clearInterval(v._vigia); try { v.pause(); } catch (e) {} }
  }

  // \u2500\u2500 Cada video de la LED: igual que prepareAutoplayVideo/_ledHardenVideo de indexGIFT \u2500\u2500
  //    \u00b7 aparece solo cuando ya tiene imagen  \u00b7 insiste en play() si se traba o queda cargando
  //    \u00b7 vigilante propio: empuj\u00f3n suave a los 6,5 s pegado y recarga del archivo a los 12 s
  //      (sin destruir el video, as\u00ed el bucle y sus tiempos siguen intactos)
  function prepararVideo(v) {
    if (!v || v._dvPreparado) return;
    v._dvPreparado = true;
    try {
      v.controls = false; v.muted = true; v.defaultMuted = true; v.playsInline = true;
      v.playbackRate = 1; v.defaultPlaybackRate = 1;
    } catch (e) {}
    function revelar() { try { if (!v._muerto) v.classList.add("dv-listo"); } catch (e) {} }
    v.addEventListener("loadeddata", revelar);
    v.addEventListener("playing", revelar);
    v.addEventListener("timeupdate", revelar);
    setTimeout(revelar, 2500);
    function tocar() {
      if (v._muerto || document.hidden) return;
      try { if (v.playbackRate !== 1) v.playbackRate = 1; var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    v.addEventListener("stalled", tocar);
    v.addEventListener("waiting", tocar);
    v.addEventListener("suspend", function () { if (!v.ended) tocar(); });
    v.addEventListener("canplay", tocar, { once: true });
    setTimeout(tocar, 120);
    setTimeout(tocar, 700);

    var ultT = -1, ultMov = Date.now(), ultCuadro = Date.now();
    function seMovio() { var t = Number(v.currentTime || 0); if (t !== ultT) { ultT = t; ultMov = Date.now(); } }
    v.addEventListener("timeupdate", seMovio);
    v.addEventListener("playing", seMovio);
    if (typeof v.requestVideoFrameCallback === "function") {
      var cuadro = function () { ultCuadro = Date.now(); try { v.requestVideoFrameCallback(cuadro); } catch (e) {} };
      try { v.requestVideoFrameCallback(cuadro); } catch (e) {}
    }
    v._vigia = setInterval(function () {
      if (!v.isConnected || v._muerto) { clearInterval(v._vigia); return; }
      if (document.hidden) return;
      if (v.paused) { if (!v.ended) tocar(); return; }
      if (v.ended) return;
      var quieto = Date.now() - ultMov, sinCuadro = Date.now() - ultCuadro;
      if (quieto > 6500 || sinCuadro > 6500) {
        var d = v.duration || 0, cur = v.currentTime || 0;
        if (!(d > 0 && d - cur < 0.5)) { try { v.currentTime = Math.max(0, cur - 0.01); } catch (e) {} tocar(); }
        if (quieto > 12000 || sinCuadro > 12000) {
          try {
            var curT = v.currentTime || 0;
            v.load();
            v.addEventListener("loadedmetadata", function () {
              try { v.currentTime = Math.min(curT, v.duration || curT); } catch (e) {}
              tocar();
            }, { once: true });
          } catch (e) {}
          ultMov = Date.now(); ultCuadro = Date.now();
        }
      }
    }, 2000);
  }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 REPRODUCTOR MIXTO (videos + im\u00e1genes en el orden de la celda) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  function reproducir(items) {
    var c = $("indicadores");
    if (!c) return;

    var f = firmaDe(items);
    var vivo = !!c.querySelector("#videoLED, #imgLED");
    if (gen > 0 && f === firmaLista && vivo) return;   // misma lista sonando \u2192 no se reinicia

    firmaLista = f;
    var miGen = ++gen;
    detener();
    nItems = items.length;
    c.classList.add("modo-video");
    c.classList.remove("dv-led-respaldo");
    ponerFondo(null);

    var idx = 0, token = 0;
    var unicoVideo  = (items.length === 1 && items[0].tipo === "video");
    var unicaImagen = (items.length === 1 && items[0].tipo === "imagen");

    function avanzar(t) {
      if (miGen !== gen || t !== token) return;       // aviso viejo \u2192 se descarta
      idx = (idx + 1) % items.length;
      mostrar();
    }

    function mostrar() {
      if (miGen !== gen) return;
      var miT = ++token;
      var it = items[idx];
      if (timer) { clearTimeout(timer); timer = null; }
      pincha(it.link);

      var viejo = $("videoLED");
      if (viejo) { viejo._muerto = true; viejo.onended = null; try { viejo.pause(); } catch (e) {} }

      if (it.tipo === "video") {
        c.innerHTML = ESPERA +
          '<div id="videoLED-container"><video id="videoLED" autoplay muted playsinline webkit-playsinline ' +
          'preload="auto" disablepictureinpicture disableremoteplayback' + (unicoVideo ? " loop" : "") + '></video></div>';
        var v = $("videoLED");
        v.muted = true;
        v.poster = leer(CK_FONDO) || POSTER;
        v.src = it.url;
        prepararVideo(v);

        // TIEMPO: (TIEMPO ORIGINAL) o sin par\u00e9ntesis \u2192 lo que dura el archivo.
        //         (3S)/(2M)/(1H) \u2192 exactamente ese tiempo (si es m\u00e1s corto, se repite).
        var dur = it.durOriginal ? 0 : (it.durMs || 0);
        if (unicoVideo) {
          if (dur > 0) {
            (function reiniciar() {
              timer = setTimeout(function () {
                if (miGen !== gen) return;
                try { v.currentTime = 0; } catch (e) {}
                reiniciar();
              }, dur);
            })();
          }
        } else if (dur > 0) {
          v.loop = true;
          timer = setTimeout(function () { avanzar(miT); }, dur);
        } else {
          v.onended = function () { avanzar(miT); };
          // Sin internet: si a los 12 s ni siquiera empez\u00f3 a bajar, se sigue con el bucle
          var vigCarga = setTimeout(function () {
            if (miGen === gen && miT === token && v.readyState < 1) avanzar(miT);
          }, 12000);
          v.addEventListener("loadeddata", function () { clearTimeout(vigCarga); }, { once: true });
        }
        v.addEventListener("error", function () {
          if (!unicoVideo) setTimeout(function () { avanzar(miT); }, 800);
        }, { once: true });
        v.addEventListener("pause", function () {
          if (!v._muerto && !document.hidden) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        });
        if (it.link) v.onclick = function () { abrirLink(it.link); };
        var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});

      } else {
        c.innerHTML = ESPERA + '<div id="imgContainerLED"><img id="imgLED" alt=""></div>';
        var img = $("imgLED");
        img.onload = function () { ponerFondo(it.url); };
        img.onerror = function () {
          img.style.visibility = "hidden";   // sin \u00edcono de imagen rota: se ve el respaldo
          if (items.length > 1 && miGen === gen && miT === token) {
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () { avanzar(miT); }, 1000);
          }
        };
        img.src = it.url;
        if (it.link) img.onclick = function () { abrirLink(it.link); };
        if (!unicaImagen) {
          timer = setTimeout(function () { avanzar(miT); }, it.durMs > 0 ? it.durMs : DUR_DEF);
        }
      }
    }

    mostrar();
  }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 MODO TEXTO (letrero que se desplaza) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  function textoLED(msg) {
    detener();
    gen++;
    firmaLista = "";
    nItems = 0;
    var c = $("indicadores");
    if (!c) return;
    c.classList.remove("modo-video", "dv-led-respaldo", "dv-con-fondo");
    c.style.backgroundImage = "";
    pincha("");
    var html = esc(msg).replace(/(https?:\/\/[^\s<>"']+)/gi, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>";
    });
    c.innerHTML = '<span id="ledContent">' + (html || esc(TEXTO_DEF)) + "</span>";
    // Velocidad constante (px por segundo): un texto largo no corre m\u00e1s r\u00e1pido que uno corto
    var span = $("ledContent");
    if (span) {
      var recorrido = (span.scrollWidth || 0) + (c.clientWidth || window.innerWidth || 390);
      var seg = Math.max(6, recorrido / 170);
      span.style.animationDuration = seg.toFixed(1) + "s, 1s";
    }
  }

  function render(payload) {
    var ex = extraerLogo(payload);
    logo(ex.logoUrl, ex.logoLink);
    var msg = String(ex.resto || "").trim();
    var media = [];
    msg.split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (tk) {
      var p = parseToken(tk);
      var url = driveDirecto(p.url);
      var tipo = tipoDe(url);
      if (tipo) media.push({ url: url, link: p.link, tipo: tipo, durMs: p.durMs, durOriginal: p.durOriginal });
    });
    if (media.length) reproducir(media);
    else textoLED(msg || TEXTO_DEF);
  }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 CARGA: cach\u00e9 al instante \u2192 servidor solo si cambi\u00f3 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  function cargar(pag) {
    pagina = String(pag || "GENERAL").toUpperCase();
    var pedida = pagina;
    var cache = leer(CK + pagina);

      render(String(d.texto || ""));

  // Igual que gmLedNuncaNegraJS de indexGIFT: revisa cada 1,3 s que la LED est\u00e9
  // DIBUJANDO de verdad (que el video tenga cuadro y que su reloj avance).
  //   1\u00ba a los 0,7 s sin dibujar: se tapa con el respaldo (nunca se ve vac\u00eda)
  //   2\u00ba en cada pasada: se reanima el MISMO video (play + empuj\u00f3n de repintado)
  //   3\u00ba a los 10 s sin caso: se rearma el bucle (m\u00e1x. 1 vez cada 15 s)

    if (!c || !c.classList.contains("modo-video")) { muertoDesde = 0; return; }
    var v = $("videoLED"), img = $("imgLED");
    if (!v && !img) { repintar(); return; }                       // LED vac\u00eda: se rearma
    if (!v || v._muerto) { muertoDesde = 0; c.classList.remove("dv-led-respaldo"); return; }

      muertoDesde = muertoDesde || Date.now();
      var lleva = Date.now() - muertoDesde;
      if (lleva >= 700) c.classList.add("dv-led-respaldo");

  function despertar() {

  function alerta(o) {
    var el = $("ledAlertaVivo");
    if (!el) return;

    if (!S.usuario) { pedirIngreso('Ingresa a tu cuenta para crear y guardar tus listas.'); return false; }

  var syncT = null;

  function sincronizar() {
    if (!S.usuario || !S.token || S.sincronizando || !enLinea()) return Promise.resolve();
    S.sincronizando = true; pintarEstadoSync();
    var uidActual = S.usuario.id;
    var paso = Promise.resolve();
    if (S.bib.sucio && S.usuario.verificado) {
      paso = api('api_guardarBiblioteca', S.token, { ts: S.bib.ts, listas: S.bib.listas, favoritas: S.bib.favoritas }).then(function (r) {
        if (!S.usuario || S.usuario.id !== uidActual) return;
        S.bib.sucio = false; S.bib.ultimoSync = Date.now(); guardarBibLocal();
      });
    } else {
      paso = api('api_miBiblioteca', S.token).then(function (r) {
        if (!S.usuario || S.usuario.id !== uidActual) return;
        if (r.usuario) actualizarUsuario(r.usuario);
        var local = S.bib;
        if (!local.sucio && (r.ts > local.ts || (!local.listas.length && !local.favoritas.length && (r.listas.length || r.favoritas.length)))) {
          local.listas = r.listas || []; local.favoritas = r.favoritas || []; local.ts = r.ts;
          rehacerFavSet();
        } else if (!local.sucio && local.ts > r.ts && (local.listas.length || local.favoritas.length) && S.usuario.verificado) {
          local.sucio = true;   // el teléfono tiene algo más nuevo que la nube: se sube
        }
        // carátulas: bajar las que cambiaron en otro teléfono, quitar las borradas
        var pendientes = {}; S.pend.car.forEach(function (x) { pendientes[x.tipo + ':' + x.clave] = 1; });
        var bajar = [];
        Object.keys(r.caratulas || {}).forEach(function (k) { if (!pendientes[k] && local.caratulas[k] !== r.caratulas[k]) bajar.push(k); });
        Object.keys(local.caratulas).forEach(function (k) {
          if (!pendientes[k] && !(k in (r.caratulas || {}))) { var t = k.split(':'); Bodega.borrarImagen(nomCar(t[0], k.slice(t[0].length + 1))); delete local.caratulas[k]; }
        });
        local.ultimoSync = Date.now(); guardarBibLocal();
        return bajarCaratulas(bajar).then(function () { if (local.sucio) { S.sincronizando = false; return sincronizar(); } });
      });
    }
    return paso.then(subirPendientes).then(fotoPerfilSync).then(function () {
      S.sincronizando = false; pintarEstadoSync(); refrescarVistaSuave();
    }).catch(function (e) {
      S.sincronizando = false; pintarEstadoSync();
      if (e && e.datos && e.datos.sinVerificar) { S.usuario.verificado = false; guardarSesion(); }

  function bajarCaratulas(claves) {
    if (!claves.length) return Promise.resolve();

    var q = lote.map(function (k) { var t = k.split(':')[0]; return { tipo: t, clave: k.slice(t.length + 1) }; });
    return api('api_caratulas', S.token, q).then(function (r) {
      (r.items || []).forEach(function (it) {
        var k = it.tipo + ':' + it.clave;

    return p.then(function (r) {
      S.pend.car.shift();

  var VL = {
    el: null, items: [], render: null, ini: -1, fin: -1,
    montar: function (el, items, render) {
      this.el = el; this.items = items; this.render = render; this.ini = this.fin = -1;
      el.classList.add('fp-virtual'); el.style.height = (items.length * ROW_H) + 'px';

    desmontar: function () { this.el = null; this.items = []; },
    pintar: function (forzar) {
      if (!this.el || !this.el.isConnected) return;
      var top = this.el.getBoundingClientRect().top, vh = window.innerHeight;
      var ini = Math.max(0, Math.floor(-top / ROW_H) - 8), fin = Math.min(this.items.length, Math.ceil((vh - top) / ROW_H) + 8);
      if (!forzar && ini === this.ini && fin === this.fin) return;

  function temaValido(t) { t = String(t || ''); return TEMA_BARRAS.hasOwnProperty(t) ? t : ''; }

    $('fpSplashIco').innerHTML = window.FP_ICONO();
    $('fpLogoTop').innerHTML = window.FP_LOGOTIPO();
    $('fpIcoBuscar').innerHTML = ic('buscar');
    document.querySelectorAll('[data-ico]').forEach(function (el) { el.innerHTML = ic(el.dataset.ico); });
    $('fpMiniSig').innerHTML = ic('sig');
    var ses = Bodega.leer('sesion');
    if (ses && ses.token && ses.usuario) { S.token = ses.token; S.usuario = ses.usuario; S.esAdmin = !!ses.esAdmin; }
    aplicarTema(S.usuario ? S.usuario.tema : '');
    S.cfg = Bodega.leer('cfg') || {};
    S.ajustes = Bodega.leer('ajustes') || S.ajustes;
    S.orden = Bodega.leer('orden') || 'titulo';
    S.escuchas = Bodega.leer('escuchas') || S.escuchas;
    if (!S.escuchas.hist) S.escuchas = { hist: [], cnt: {} };
    cargarBibLocal();
    cargarMusica();
    restaurarCola();
    pintarAvatar(); estadoRed();
    ir('inicio', {}, true);
    quitarSplash();
    refrescarInicio();
    cuandoLibre(function () { ledPrecargarTodo(); }, 6000);
  }
  try { arrancar(); } catch (e) {
    console.error(e);
    var s = $('fpSplash'); if (s) s.remove();
    try { if (AND && AND.listo) AND.listo(); } catch (x) { }
    $('vista').innerHTML = '<div class="vacio"><div class="ic">😵</div><b>No se pudo iniciar Fineplay</b>' + esc(e.message) + '<br><br><button class="btn btn-lila" onclick="location.reload()">Reintentar</button></div>';
  }
})();
</script>

<script>
/* ===== PWA: instalar Fineplay + funcionar sin internet ===== */
(function () {
  /* Actualización automática: busca la versión nueva de GitHub cada vez que se abre o se vuelve a la app,
     y cuando llega, recarga UNA vez para mostrarla (sin tener que borrar nada). */
  if ('serviceWorker' in navigator) {
    var fpTeniaSW = !!navigator.serviceWorker.controller, fpRecargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!fpTeniaSW || fpRecargado) return; fpRecargado = true; location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
      reg.update().catch(function () { });
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () { }); });
    }).catch(function (e) { console.warn('sw', e); });
  }
  var barra = document.getElementById('fpInstalar'), btn = document.getElementById('fpInstalarBtn'), aviso = null;
  var instalada = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
  var ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua);
  var dentroDeApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(ua);   // navegador interno de WhatsApp/Facebook: ahí no se puede instalar
  // La barra se muestra SIEMPRE en el navegador (no solo cuando Chrome avisa); instalada, desaparece
  if (!instalada && sessionStorage.getItem('fpNoInstalar') !== '1') barra.classList.add('ver');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); aviso = e; btn.textContent = 'Instalar'; });
  btn.onclick = function () {
    if (aviso) {
      aviso.prompt();
      aviso.userChoice.then(function (r) { if (r.outcome === 'accepted') barra.classList.remove('ver'); aviso = null; });
      return;
    }
    var m;
    if (dentroDeApp) m = 'Estás dentro de otra app (WhatsApp/Facebook). Toca ⋮ y elige "Abrir en Chrome"; ahí aparece Instalar.';
    else if (ios) m = 'En iPhone: abre esta página en Safari, toca Compartir (cuadro con flecha ↑) y elige "Agregar a pantalla de inicio".';
    else m = 'Toca el menú ⋮ de Chrome (arriba a la derecha) y elige "Instalar aplicación" o "Agregar a la pantalla principal".';
    alert(m);
  };
  document.getElementById('fpInstalarX').onclick = function () { barra.classList.remove('ver'); sessionStorage.setItem('fpNoInstalar', '1'); };
  window.addEventListener('appinstalled', function () { barra.classList.remove('ver'); });
})();
</script>
